<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yêu cầu hỗ trợ - Badminton Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            padding-top: 80px;
        }

        .card {
            border: none;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>

<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <div class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold text-primary"><i class="fas fa-headset me-2"></i>Yêu cầu hỗ trợ</h2>
            <a th:href="@{/users/profile}" class="btn btn-outline-secondary">
                <i class="fas fa-arrow-left me-2"></i>Quay lại hồ sơ
            </a>
        </div>

        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="card p-4">
            <ul class="nav nav-pills mb-3" id="pills-tab" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="pills-exchange-tab" data-bs-toggle="pill"
                        data-bs-target="#pills-exchange" type="button">Đổi trả hàng</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="pills-warranty-tab" data-bs-toggle="pill"
                        data-bs-target="#pills-warranty" type="button">Bảo hành</button>
                </li>
            </ul>
            <div class="tab-content" id="pills-tabContent">
                <div class="tab-pane fade show active" id="pills-exchange" role="tabpanel">
                    <div class="alert alert-info">
                        Danh sách các yêu cầu đổi trả bạn đã gửi.
                    </div>
                    <!-- Placeholder List -->
                    <p class="text-center text-muted my-5">Chưa có yêu cầu đổi trả nào.</p>
                </div>
                <div class="tab-pane fade" id="pills-warranty" role="tabpanel">
                    <div class="alert alert-info">
                        Danh sách phiếu bảo hành của bạn.
                    </div>
                    <!-- Placeholder List -->
                    <p class="text-center text-muted my-5">Chưa có yêu cầu bảo hành nào.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
